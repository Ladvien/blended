[project]
name = "blended"
version = "0.1.0"
description = "A Blender-based harness for agentic modeling of game assets."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
capture = ["pillow"]

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=8.0", "ruff>=0.16.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blended = ["py.typed", "agent/prompts/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: requires a working bpy (Blender-as-module or a live Blender).",
]

[tool.mypy]
python_version = "3.11"

# src layout: map src/blended/x.py to `blended.x`, and tests/blender/y.py to
# `tests.blender.y` (test_harness imports test_retry by that dotted path).
# Without this mypy names the same test file two ways and bails.
mypy_path = "src"
explicit_package_bases = true

# bpy, bmesh and mathutils are compiled C modules that only exist inside a
# Blender runtime, and they ship no stubs. numpy is bundled by Blender;
# Pillow is the optional `capture` extra. None are importable from the dev
# venv, so mypy treats them as Any instead of erroring at every import site.
[[tool.mypy.overrides]]
module = ["bpy.*", "bmesh.*", "mathutils.*", "numpy.*", "PIL.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# Every one of these is @dataclass(frozen=True), so a shared default instance
# cannot be mutated by a caller. B008/RUF009 assume mutability; rewriting to a
# None sentinel would add a second code path through every one of these
# functions to defend against a bug the frozen dataclass already prevents.
extend-immutable-calls = [
    "blended.analyze.mesh_checks.MeshBudget",
    "blended.capture.views.CaptureSettings",
    "blended.harness.HarnessSettings",
    "blended.ingest.cleanup.CleanupSettings",
]

[tool.ruff.lint.per-file-ignores]
# The example scripts MUST defer their imports: sys.path has to be
# extended before `blended` is importable at all, and the factory reset
# has to run before importing modules that touch bpy state. Both are
# structural requirements of running standalone against bpy, not
# untidiness, so E402 is silenced for examples only.
"examples/*.py" = ["E402"]
# Blender requires the bl_info dict to appear before any import, so the
# addon's imports are necessarily below it. Same structural constraint,
# not untidiness.
"blender_addon/__init__.py" = ["E402"]

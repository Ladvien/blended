[project]
name = "blended"
version = "0.1.0"
description = "A Blender-based harness for agentic modeling of game assets."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: requires a working bpy (Blender-as-module or a live Blender).",
]
